<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable — Pairwise</title>
  <style>
    :root { --ink: #1a1a2e; --ink-2: #4a4a6a; --bg: #f8f8fc; --sky: #4f7cff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.7;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .container { max-width: 480px; padding: 24px; text-align: center; }
    .logo { font-size: 22px; font-weight: 700; color: var(--sky); margin-bottom: 32px; }
    .code { font-size: 56px; font-weight: 700; color: var(--sky); line-height: 1; }
    h1 { font-size: 22px; font-weight: 700; margin: 16px 0 8px; }
    p { font-size: 15px; color: var(--ink-2); margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 11px 24px; border-radius: 22px;
      background: var(--sky); color: #fff; text-decoration: none;
      font-size: 14px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Pairwise</div>
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>
      Cette adresse n'existe pas.<br />
      <span lang="en">This page doesn't exist.</span>
    </p>
    <a class="btn" href="/">Retour à l'application</a>
  </div>
</body>
</html>
