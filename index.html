<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf4ec" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <title>Pairwise</title>
    <script>
      // Applique le thème AVANT le premier rendu. Le thème réel vit dans
      // Firestore (par membre) et n'arrive qu'après un aller-retour réseau :
      // sans cette ligne, l'app peint le thème clair puis bascule en nuit une
      // seconde plus tard. La clé est écrite par src/utils/bootPrefs.js — la
      // garder en phase avec THEME_KEY là-bas.
      try {
        var t = localStorage.getItem("pw:boot:theme");
        if (t) {
          document.documentElement.setAttribute("data-theme", t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "pairwise-dark" ? "#0a1520" : "#fdf4ec");
        }
      } catch (e) {
        /* stockage indisponible : on garde le thème clair par défaut */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
